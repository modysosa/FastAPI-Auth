name: Deploy FastAPI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-fastapi-auth
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux, X64, fastapi-auth]
    timeout-minutes: 15

    steps:
      - name: Download code
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Stop application
        run: sudo -n /usr/bin/systemctl stop fastapi-auth

      - name: Deploy application
        run: sudo -n -u fastapiapp /usr/local/bin/deploy-fastapi-auth

      - name: Start application
        if: always()
        run: sudo -n /usr/bin/systemctl start fastapi-auth

      - name: Check API
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 3 --retry-connrefused \
            --max-time 10 \
            --output /dev/null \
            http://127.0.0.1:8002/openapi.json
